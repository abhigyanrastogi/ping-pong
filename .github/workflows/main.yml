name: Deploy Ping Pong Project

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-versions: '20'

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::329068432608:role/github-actions-invalidate-cloudfront-upload-s3
          aws-region: us-east-1

      - name: Sync S3
        run: aws s3 sync ./dist s3://abhigyanchandrarastogi-portfolio/projects/ping-pong --delete

      - name: CloudFront Invalidation
        run: aws cloudfront create-invalidation --distribution-id E344VXPUM5BXKM --paths "/*"
